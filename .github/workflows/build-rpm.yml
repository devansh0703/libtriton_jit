name: Build RPM Packages

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'packaging/rpm/**'
      - '.github/workflows/build-rpm.yml'
  workflow_dispatch:

jobs:
  build-rpm-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - base_image: "nvidia/cuda:12.6.0-devel-rockylinux9"
            label: "rocky9-cuda1260"
            backend: "CUDA"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build RPM packages
        run: |
          cd packaging/rpm
          ./build-rpm.sh \
            --base-image "${{ matrix.base_image }}" \
            --backend "${{ matrix.backend }}" \
            --output-dir "${{ github.workspace }}/output"

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-${{ matrix.label }}
          path: |
            output/rpms/**/*.rpm
            output/srpms/**/*.rpm
          retention-days: 7

      - name: Prepare RPM release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          find output -name "*.rpm" -print0 | while IFS= read -r -d '' rpm; do
            cp "$rpm" "release/${{ matrix.label }}-$(basename "$rpm")"
          done

      - name: Upload RPM packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.rpm
